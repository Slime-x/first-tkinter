
name: Build Unit Converter

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name UnitConverter --hidden-import=PIL._tkinter_finder --hidden-import=PIL._imagingtk app.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: UnitConverter-Windows
          path: dist/UnitConverter.exe

  build-macos:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app
        run: |
          pyinstaller --noconfirm --clean --windowed --name UnitConverter --hidden-import=PIL._tkinter_finder --hidden-import=PIL._imagingtk app.py

      - name: Package macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/UnitConverter.app dist/UnitConverter-macOS.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: UnitConverter-macOS
          path: dist/UnitConverter-macOS.zip

  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Tk dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name UnitConverter --hidden-import=PIL._tkinter_finder --hidden-import=PIL._imagingtk app.py

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: UnitConverter-Linux
          path: dist/UnitConverter

  release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-macos
      - build-linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
